<style>
:root{--acc:#f0a63c;--acc-ink:#1d1204;--glow:rgba(240,166,60,.17)}
.screen.board{max-width:44rem;padding-left:.6rem;padding-right:.6rem}
.code{font-size:3.4rem;letter-spacing:.4rem;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:var(--acc);margin:.4rem 0}
.grid{display:flex;flex-wrap:wrap;margin:.4rem -.2rem}
.t{position:relative;width:calc(25% - .4rem);margin:.2rem;padding:0;border:1px solid var(--line);border-radius:.7rem;background:var(--bg2);color:var(--ink);
  font:inherit;cursor:pointer;overflow:hidden;-webkit-appearance:none;appearance:none;text-align:center;transition:opacity .2s}
@media(min-width:560px){.t{width:calc(16.666% - .4rem)}}
.t .ph{display:block;width:100%;padding-top:110%;background:#0a0810 center 18%/cover no-repeat;position:relative}
.t .em{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:2rem}
.t .nm{display:block;font-size:.66rem;line-height:1.15;padding:.3rem .2rem .35rem;min-height:2.1rem;font-weight:600}
.t .fm{display:block;font-size:.56rem;color:var(--mut);font-weight:400;margin-top:.1rem}
.t.down{opacity:.16}
.t.down:after{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--ink);transform:rotate(-35deg)}
.t.aim{border-color:var(--acc)}
.chute .t{box-shadow:0 0 0 1px var(--acc)}
.me{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--acc);border-radius:1rem;padding:.45rem;margin:.2rem 0 .5rem;text-align:left}
.me .ph{flex:0 0 3.4rem;height:3.4rem;border-radius:.6rem;background:#0a0810 center 18%/cover no-repeat;position:relative;margin-right:.7rem;overflow:hidden}
.me .ph .em{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.me b{display:block;font-size:1.05rem}
.me small{color:var(--mut);font-size:.75rem}
.me .hid{filter:blur(9px)}
.me button{margin-left:auto;flex:0 0 auto;width:auto}
.bar2{display:flex;margin:.2rem -.25rem 0}
.bar2 .btn{flex:1 1 0;margin:.25rem}
.big2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:2.6rem;line-height:1.1;margin:.4rem 0;color:var(--acc)}
.hero{width:11rem;height:12rem;margin:.6rem auto;border-radius:1rem;background:#0a0810 center 18%/cover no-repeat;position:relative;border:1px solid var(--line)}
.hero .em{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:5rem}
.testa{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:3rem;line-height:1.1;margin:1rem 0 .3rem}
.clock{font-size:2.4rem;font-variant-numeric:tabular-nums;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:var(--acc)}
.cred{font-size:.68rem;color:var(--mut);margin-top:1.2rem}
.cred a{color:var(--mut)}
</style>

  });
}
function lobby(code, me) {
  JG.view('<p class="kick">Partida aberta · ' + TEMAS[+code.charAt(3)].n + '</p><div class="code">' + code + '</div>' +
    '<p class="mut">No outro celular: Quem Sou Eu, "Entrar com o código do outro", e digitar este número.</p>' +
    '<button class="btn primary" data-act="go">Ver o tabuleiro</button>', { go: function () { start(+code, 0, me); } });
}

/* O código define tabuleiro e os dois segredos; cada celular sabe o segredo do outro só para conferir o chute. */
function start(code, role, me) {
  S = { code: code, th: code % 10, role: role, me: me, n: JG.names(), k: 1, w: [0, 0] };
  partida();
}
function partida() {
  var r = JG.rng(S.code * 97 + S.k * 7919);
  S.b = JG.shuffle(TEMAS[S.th].l(), r).slice(0, N);
  var a = Math.floor(r() * N), b = (a + 1 + Math.floor(r() * (N - 1))) % N;
  S.sec = [a, b]; S.down = {}; S.chute = false; S.hide = false;
  S.comeca = (S.k % 2 === 1) === (S.role === 0);
  tab();
}
function tab() {
  var mine = S.b[S.sec[S.role]], outro = esc(S.n[1 - S.me]), vivos = 0;
  pts('Partida <b>' + S.k + '</b>');
  var g = S.b.map(function (p, i) {
    if (!S.down[i]) vivos++;
    return '<button class="t' + (S.down[i] ? ' down' : '') + '" data-act="t" data-i="' + i + '">' + ph(p) + '<span class="nm">' + esc(p.n) + (p.s ? '<span class="fm">' + esc(p.s) + '</span>' : '') + '</span></button>';
  }).join('');
  JG.view('<div class="me">' + ph(mine, S.hide ? 'hid' : '') + '<div><small>Você é</small><b>' + (S.hide ? '•••' : esc(mine.n)) + '</b></div><button class="btn ghost sm" data-act="h">' + (S.hide ? 'Mostrar' : 'Esconder') + '</button></div>' +
    (S.chute ? '<p class="acc"><b>Modo chute:</b> toque em quem você acha que ' + outro + ' é. Errou, perdeu.</p>' :
      '<p class="mut small">' + (S.comeca ? 'Você começa' : outro + ' começa') + '. Uma pergunta de sim ou não por vez. Toque para derrubar. Restam <b style="color:var(--ink)">' + vivos + '</b>.</p>') +
    '<div class="grid' + (S.chute ? ' chute' : '') + '">' + g + '</div>' +
    '<div class="bar2">' + (S.chute ? '<button class="btn" data-act="c">Cancelar chute</button>' : '<button class="btn primary" data-act="c">Chutar</button>') +
    '<button class="btn ghost sm" data-act="r">Levantar todos</button></div>', {
    t: function (el) {
      var i = +el.getAttribute('data-i');
      if (S.chute) { confirma(i); return; }
      S.down[i] = !S.down[i]; el.className = 't' + (S.down[i] ? ' down' : '');
      var n = 0; for (var j = 0; j < N; j++) if (!S.down[j]) n++;
      var p = document.querySelector('.mut.small b'); if (p) p.textContent = n;
    },
    h: function () { S.hide = !S.hide; tab(); },
    c: function () { S.chute = !S.chute; tab(); },
    r: function () { S.down = {}; tab(); }
  }, { wide: true, back: menu });
  var sc = document.querySelector('.screen'); if (sc) sc.className += ' board';
}
function confirma(i) {
  var p = S.b[i], outro = esc(S.n[1 - S.me]);
  JG.view('<p class="kick">Chute final</p><div class="hero"></div><h2>' + outro + ' é <span class="acc">' + esc(p.n) + '</span>?</h2>' +
    '<p class="mut">Se errar, a partida é de ' + outro + '.</p><button class="btn primary" data-act="y">Sim, chutar</button><button class="btn" data-act="n">Voltar ao tabuleiro</button>', {
    y: function () { fim(i === S.sec[1 - S.role], i); },
    n: function () { S.chute = false; tab(); }
  });
  heroImg(p);
}
function heroImg(p) {
  var h = document.querySelector('.hero'); if (!h) return;
  if (p.f) { h.style.backgroundImage = "url('" + p.f + "')"; h.innerHTML = ''; } else h.innerHTML = '<span class="em">' + (p.e || esc(p.n.charAt(0))) + '</span>';
}
function fim(ok, i) {
  var real = S.b[S.sec[1 - S.role]], outro = esc(S.n[1 - S.me]), eu = esc(S.n[S.me]);
  if (ok) S.w[S.me]++; else S.w[1 - S.me]++;
  JG.view('<p class="kick">' + (ok ? 'Acertou' : 'Errou') + '</p><div class="hero"></div><div class="big2">' + esc(real.n) + '</div>' +
    '<h2>' + (ok ? 'Partida de ' + eu + '. Avise ' + outro + '.' : 'Não era ' + esc(S.b[i].n) + '. A partida é de ' + outro + '.') + '</h2>' +
    '<div class="vs"><div><div class="who">' + eu + '</div><div class="big">' + S.w[S.me] + '</div></div><div><div class="who">' + outro + '</div><div class="big">' + S.w[1 - S.me] + '</div></div></div>' +
    '<p class="mut small">Placar deste celular. Para a revanche, os dois apertam o botão abaixo.</p>' +
    '<button class="btn primary" data-act="nx">Revanche · partida ' + (S.k + 1) + '</button><button class="btn" data-act="m">Voltar ao início</button>', {
    nx: function () { S.k++; partida(); },
    m: menu
  });
  heroImg(real);
}

/* ---------- Na testa: um celular, 60 segundos ---------- */
function testa(th) {
  var deck = JG.shuffle(TEMAS[th].l()), i = 0, ok = 0, pulou = [], t = 60, T = null;
  JG.view('<p class="kick">Na testa · ' + TEMAS[th].n + '</p><h2>Quem segura o celular na testa não pode ver a tela</h2>' +
    '<p class="mut">O outro dá dicas sem dizer o nome. Acertou, toque em "Acertou". Travou, "Passa". 60 segundos.</p><button class="btn primary" data-act="go">Começar</button><button class="btn ghost sm" data-act="b">Voltar</button>', {
    go: function () { carta(); T = setInterval(tick, 1000); },
    b: menu
  });
  function tick() {
    t--; var c = document.getElementById('ck');
    if (!c) { clearInterval(T); return; }
    c.textContent = t;
    if (t <= 0) { clearInterval(T); if (navigator.vibrate) navigator.vibrate([300, 100, 300]); fimT(); }
  }
  function carta() {
    var p = deck[i % deck.length];
    JG.view('<div class="clock" id="ck">' + t + '</div><div class="hero"></div><div class="testa">' + esc(p.n) + '</div>' + (p.s ? '<p class="mut">' + esc(p.s) + '</p>' : '') +
      '<div class="row"><button class="btn" data-act="p">Passa</button><button class="btn primary" data-act="a">Acertou</button></div>', {
      a: function () { ok++; i++; carta(); },
      p: function () { pulou.push(p.n); i++; carta(); }
    }, { back: function () { clearInterval(T); menu(); } });
    heroImg(p);
  }
  function fimT() {
    JG.view('<p class="kick">Tempo</p><div class="big acc">' + ok + '</div><h2>' + (ok === 1 ? 'acerto' : 'acertos') + '</h2>' +
      (pulou.length ? '<p class="mut small">Passou: ' + esc(pulou.join(', ')) + '</p>' : '') +
      '<button class="btn primary" data-act="g">Agora é o outro</button><button class="btn" data-act="m">Voltar ao início</button>', {
      g: function () { testa(th); }, m: menu
    });
  }
}

menu();
})();
</script>
