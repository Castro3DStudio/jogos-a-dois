<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#060914" id="tc">
<title>Wishlist a dois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Dois temas: noite segue o Noctua (aurora + vidro escuro, dourado do hub); dia é Frutiger Aero (céu, bolhas, vidro brilhante). */
:root{
  --serif:"Instrument Serif","Iowan Old Style",Palatino,Georgia,serif;
  --sans:"Instrument Sans",-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --spring:cubic-bezier(.2,1.25,.3,1);--out:cubic-bezier(.2,.8,.2,1);
  --r:22px;
}
body.night{
  color-scheme:dark;
  --bg:#060914;--bg2:#0C1124;--ink:#EEF1FF;--mut:#9AA3C7;--faint:#6A7299;
  --glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.11);--edge:rgba(255,255,255,.16);--edge2:rgba(255,255,255,.08);
  --hi:inset 0 1px 0 rgba(255,255,255,.14);--shadow:0 20px 50px -28px rgba(0,0,0,.8);
  --brand:#e2b55a;--accent:#9CA8FF;--good:#4FD39A;--bad:#FF6B7F;
  --pri:#e2b55a;--pri-ink:#1a1206;--pri-gloss:none;
  --gloss:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 45%);
  --sheet:rgba(14,19,40,.86);--field:rgba(0,0,0,.25);
}
body.day{
  color-scheme:light;
  --bg:#3aa6ee;--bg2:#e9f8ff;--ink:#0b2944;--mut:#3d6585;--faint:#6f90aa;
  --glass:rgba(255,255,255,.52);--glass2:rgba(255,255,255,.75);--edge:rgba(255,255,255,.95);--edge2:rgba(255,255,255,.7);
  --hi:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(120,180,220,.25);--shadow:0 14px 34px -16px rgba(10,80,150,.45);
  --brand:#0a6fc2;--accent:#0a8fd6;--good:#2fa83a;--bad:#e0484f;
  --pri:linear-gradient(180deg,#8fe3ff 0%,#2db0f0 48%,#0b8fdc 52%,#3cc0f7 100%);--pri-ink:#fff;
  --pri-gloss:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.35),0 6px 16px -6px rgba(0,110,200,.7);
  --gloss:linear-gradient(180deg,rgba(255,255,255,.85) 0%,rgba(255,255,255,.35) 48%,rgba(255,255,255,0) 50%);
  --sheet:rgba(240,250,255,.88);--field:rgba(255,255,255,.7);
}
*,*:before,*:after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#060914}
body{margin:0;min-height:100vh;font-family:var(--sans);font-size:16px;line-height:1.45;color:var(--ink);background:var(--bg2);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;transition:color .5s}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Fundos ---------- */
.bgl{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:opacity .7s}
body.day .aurora,body.night .sky{opacity:0}
.aurora{background:linear-gradient(180deg,#060914,#0C1124)}
.aurora span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 26s ease-in-out infinite alternate}
.aurora .a{width:62vmax;height:62vmax;background:#2B3CB8;top:-26vmax;left:-22vmax}
.aurora .b{width:52vmax;height:52vmax;background:#7A2A78;bottom:-26vmax;right:-22vmax;opacity:.42;animation-duration:32s;animation-delay:-8s}
.aurora .c{width:40vmax;height:40vmax;background:#0F6E66;top:38%;left:52%;opacity:.3;animation-duration:22s;animation-delay:-4s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,4vmax) scale(1.12)}100%{transform:translate(-4vmax,7vmax) scale(.95)}}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.sky{background:linear-gradient(180deg,#2c9ce8 0%,#76c9f7 32%,#c4ecff 62%,#effbff 82%,#dff7d6 100%)}
.sun{position:absolute;top:-18vmax;right:-14vmax;width:60vmax;height:60vmax;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,255,255,.45) 18%,rgba(255,255,255,0) 60%);animation:pulse 9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.85}}
.ray{position:absolute;top:-10%;right:8%;width:120vmax;height:3px;transform-origin:100% 50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5));opacity:.5}
.cloud{position:absolute;height:6vmax;border-radius:6vmax;background:rgba(255,255,255,.75);filter:blur(6px);animation:float 60s linear infinite}
@keyframes float{from{transform:translateX(-40vw)}to{transform:translateX(140vw)}}
.hills{position:absolute;left:-10%;right:-10%;bottom:-2px;height:24vh}
.hills svg{width:100%;height:100%;display:block}
.bub{position:absolute;bottom:-12vmax;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,.25) 22%,rgba(120,210,255,.12) 55%,rgba(255,255,255,.55) 72%,rgba(255,255,255,0) 74%);
  animation:rise var(--d,18s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes rise{0%{transform:translate(0,0)}25%{transform:translate(3vw,-30vh)}50%{transform:translate(-2vw,-60vh)}75%{transform:translate(3vw,-90vh)}100%{transform:translate(0,-125vh)}}

/* ---------- Estrutura ---------- */
.wrap{position:relative;z-index:1;max-width:34rem;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 110px)}
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
  border:1px solid var(--edge2);box-shadow:var(--hi),var(--shadow);border-radius:var(--r)}
.glass,.btn{isolation:isolate}
.glass.gl:before,.btn.gl:before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--gloss);pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 8px}
.top a{color:var(--mut);text-decoration:none;font-size:.9rem;padding:8px 6px}
.brand{font-family:var(--serif);font-style:italic;font-size:1.4rem;color:var(--brand);letter-spacing:-.01em}
.ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--edge2);background:var(--glass);box-shadow:var(--hi);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:transform .3s var(--spring)}
.ico:active{transform:scale(.88) rotate(-12deg)}
.ico svg{width:20px;height:20px}
.kick{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:14px 0 2px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.6rem,12vw,3.6rem);line-height:.95;letter-spacing:-.025em;margin:4px 0 6px}
h1 em{color:var(--brand)}
h2{font-family:var(--serif);font-weight:400;font-size:1.9rem;line-height:1.05;margin:6px 0}
.mut{color:var(--mut)}.small{font-size:.86rem}
.row{display:flex;gap:8px;align-items:center}

/* Segmentos com indicador deslizante */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;margin:10px 0}
.seg button{position:relative;z-index:1;border:0;background:none;padding:10px 6px;border-radius:999px;color:var(--mut);font-weight:600;font-size:.92rem;
  display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;white-space:nowrap;transition:color .3s}
.seg button.on{color:var(--ink)}
.seg .ind{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;border-radius:999px;background:var(--glass2);border:1px solid var(--edge);
  box-shadow:var(--hi);transition:transform .5s var(--spring),width .5s var(--spring)}
body.day .seg .ind{background:linear-gradient(180deg,#fff,rgba(255,255,255,.7));box-shadow:0 4px 12px -4px rgba(10,100,180,.4),inset 0 -1px 0 rgba(150,200,230,.5)}
.av{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.7rem;font-weight:700;color:#fff;
  background:linear-gradient(145deg,var(--c),var(--c2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.seg.sub{width:auto;margin:6px 0 14px}
.seg.sub button{font-size:.85rem;padding:8px 4px}

/* Botões */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 20px;border-radius:999px;border:1px solid var(--edge);
  background:var(--glass);box-shadow:var(--hi);font-weight:600;font-size:1rem;text-decoration:none;color:var(--ink);overflow:hidden;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:transform .25s var(--spring),background .2s}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:transparent;box-shadow:var(--pri-gloss)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--mut);-webkit-backdrop-filter:none;backdrop-filter:none}
.btn.sm{width:auto;padding:10px 16px;font-size:.9rem}
.btn svg{width:18px;height:18px;flex:none}
.btn.go{background:linear-gradient(180deg,#9ff09a 0%,#46c43c 48%,#2ea825 52%,#5fd453 100%);color:#fff;border-color:transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 6px 16px -6px rgba(30,140,20,.7)}
body.night .btn.go{background:var(--good);color:#06231A;box-shadow:none}
.btn.go.done{background:var(--glass2);color:var(--good);border-color:var(--good);box-shadow:none}

/* ---------- Bento ---------- */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:clamp(4.4rem,20.5vw,7.2rem);gap:10px;grid-auto-flow:dense}
.tile{--rx:0deg;--ry:0deg;--s:1;--mx:50%;--my:30%;position:relative;overflow:hidden;border:0;padding:0;border-radius:var(--r);text-align:left;color:#fff;
  background:linear-gradient(150deg,var(--c) 0%,var(--c2) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),var(--shadow);
  transform:perspective(700px) rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--s));transition:transform .35s var(--out);
  animation:pop .7s var(--spring) backwards;animation-delay:calc(var(--i,0) * 55ms);grid-column:span 2;grid-row:span 2}
.tile.lv2{grid-row:span 3}
.tile.lv3{grid-column:span 4;grid-row:span 3}
@keyframes pop{from{transform:perspective(700px) translateY(26px) rotateX(18deg) scale(.86);opacity:0}}
.tile:active{--s:.96}
.tile .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 6s ease}
.tile:hover .ph{transform:scale(1.08)}
.tile .ph+.fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72))}
.tile:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.35),rgba(255,255,255,0) 45%);opacity:.7}
body.day .tile:before{content:"";position:absolute;left:0;right:0;top:0;height:50%;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.12));border-radius:var(--r) var(--r) 40% 40% / var(--r) var(--r) 14px 14px}
.emo{position:absolute;top:12px;left:14px;font-size:2.1rem;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));animation:bob 5s ease-in-out infinite;animation-delay:calc(var(--i,0) * -.7s)}
.lv2 .emo{font-size:2.8rem}.lv3 .emo{font-size:3.8rem;top:16px;left:18px}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:12px 14px;display:block}
.cap b{display:block;font-weight:600;font-size:.98rem;line-height:1.18;text-shadow:0 1px 8px rgba(0,0,0,.3);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.lv3 .cap b{font-family:var(--serif);font-weight:400;font-size:2rem;line-height:1}
.lv2 .cap b{font-size:1.1rem}
.cap small{display:block;font-size:.76rem;opacity:.88;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{position:absolute;top:12px;right:12px;z-index:2;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:5px 9px;border-radius:999px;
  background:rgba(0,0,0,.25);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.badge{position:absolute;top:12px;right:12px;z-index:3;font-size:.7rem;font-weight:700;padding:5px 10px;border-radius:999px;background:#fff;color:#0b2944;
  box-shadow:0 4px 12px rgba(0,0,0,.25);animation:pop .5s var(--spring) backwards}
.badge.new{background:var(--brand);color:#111}
.foot .av{display:inline-grid;vertical-align:middle;margin-right:2px}
.badge+.lvl{display:none}
.tile.vague{background:var(--glass);color:var(--ink);box-shadow:var(--hi),var(--shadow);border:1.5px dashed var(--edge);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.tile.vague:after{opacity:.25}
.tile.vague .cap b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.35rem;line-height:1.05;text-shadow:none}
.tile.vague.lv3 .cap b{font-size:2.1rem}
.tile.vague .vk{position:absolute;top:14px;left:14px;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--c)}
body.day .tile.vague:before{display:none}
.empty{padding:26px 20px;text-align:center}
.empty .big{font-size:3rem;animation:bob 4s ease-in-out infinite;display:inline-block}
.stats{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.stat{padding:7px 12px;border-radius:999px;font-size:.82rem;color:var(--mut);background:var(--glass);border:1px solid var(--edge2)}
.stat b{color:var(--ink);font-weight:700}
.gotlist{margin-top:18px;padding:6px 0}
.gotlist summary{list-style:none;padding:10px 16px;color:var(--mut);font-size:.9rem;cursor:pointer}
.gotlist summary::-webkit-details-marker{display:none}
.gl-row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;border:0;background:none;text-align:left;border-top:1px solid var(--edge2)}
.gl-row span{flex:1;min-width:0;text-decoration:line-through;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Stories (visão do outro) */
.rings{display:flex;gap:16px;margin:4px 0 16px;overflow-x:auto;padding:4px 2px 6px}
.ring{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;color:var(--ink)}
.ring .o{width:76px;height:76px;border-radius:50%;padding:3px;background:conic-gradient(from 0deg,var(--c),var(--brand),var(--c2),var(--c));animation:spin 6s linear infinite}
.ring .o span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--bg2);border:3px solid var(--bg2);font-size:1.9rem;animation:spin 6s linear infinite reverse}
.ring.seen .o{background:var(--edge);animation:none}.ring.seen .o span{animation:none}
.ring small{font-size:.78rem;color:var(--mut)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Ficha */
.fx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fx .f{padding:14px 16px;border-radius:var(--r);min-width:0;animation:pop .6s var(--spring) backwards;animation-delay:calc(var(--i,0) * 50ms)}
.fx .f.w{grid-column:span 2}
.fx .f small{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.fx .f b{display:block;font-family:var(--serif);font-weight:400;font-size:1.55rem;line-height:1.1;overflow-wrap:anywhere}
.fx .f.w b{font-family:var(--sans);font-size:1rem;font-weight:500;line-height:1.4}
.fx .f.no{border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.fx .f.no small{color:var(--bad)}
.fx .f.blank b{color:var(--faint)}

/* Dock fixo */
.dock{position:fixed;z-index:5;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(34rem - 32px,calc(100% - 32px));
  display:flex;gap:8px;padding:7px;border-radius:999px;animation:up .6s var(--spring) backwards}
@keyframes up{from{transform:translate(-50%,120%)}}
.dock .btn{padding:13px 14px}
.dock .add{flex:0 0 auto;width:52px;padding:0;height:50px;font-size:1.6rem;font-weight:400}
.dot{display:inline-block;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:.72rem;line-height:20px;font-weight:700;animation:pop .4s var(--spring) backwards}
.shim:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shim 2.6s ease-in-out infinite}
@keyframes shim{0%{left:-60%}60%,100%{left:130%}}

/* ---------- Sheet ---------- */
.sheet{position:fixed;inset:0;z-index:20;visibility:hidden}
.sheet.on{visibility:visible}
.sheet .back{position:absolute;inset:0;background:rgba(0,10,30,.45);opacity:0;transition:opacity .35s}
.sheet.on .back{opacity:1}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 auto;max-width:36rem;
  background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border-radius:28px 28px 0 0;border:1px solid var(--edge2);border-bottom:0;box-shadow:0 -20px 60px -20px rgba(0,0,0,.5);
  padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .55s var(--spring)}
.sheet.on .panel{transform:none}
.sheet.drag .panel{transition:none}
.grab{display:block;width:44px;height:5px;border-radius:5px;background:var(--edge);margin:4px auto 10px;box-shadow:0 0 0 14px transparent}
.hero{position:relative;height:210px;border-radius:var(--r);overflow:hidden;margin-bottom:14px;background:linear-gradient(150deg,var(--c),var(--c2));display:grid;place-items:center}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 12s ease-out both}
.hero .emo{position:static;font-size:5rem}
@keyframes kb{from{transform:scale(1.15)}to{transform:scale(1)}}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:.85rem;background:var(--glass);border:1px solid var(--edge2);color:var(--ink)}
.note{padding:12px 14px;border-radius:16px;background:var(--field);border:1px solid var(--edge2);font-size:.95rem;margin:0 0 12px;white-space:pre-wrap}
.stack{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Formulário */
label.fl{display:block;font-size:.8rem;color:var(--mut);margin:14px 0 6px}
.in{display:block;width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--edge2);border-radius:14px;padding:13px 14px;outline:none;
  -webkit-appearance:none;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea.in{min-height:76px;resize:vertical}
.err{color:var(--bad);font-size:.84rem;margin:6px 2px 0}
.lvpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvpick button{border:1px solid var(--edge2);background:var(--glass);border-radius:16px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.82rem;color:var(--mut);transition:all .3s var(--spring)}
.lvpick button.on{border-color:var(--accent);color:var(--ink);background:var(--glass2);transform:translateY(-2px)}
.lvpick i{display:grid;grid-template-columns:repeat(4,6px);grid-auto-rows:6px;gap:2px}
.lvpick i s{display:block;border-radius:2px;background:var(--edge)}
.lvpick button.on i s.f{background:var(--accent)}
.emos{display:flex;flex-wrap:wrap;gap:6px}
.emos button{width:44px;height:44px;border-radius:14px;border:1px solid var(--edge2);background:var(--glass);font-size:1.35rem;transition:transform .3s var(--spring)}
.emos button.on{border-color:var(--accent);background:var(--glass2);transform:scale(1.12)}
.fprev{margin-top:8px;max-height:140px;border-radius:14px;display:block}
.guess{font-size:.82rem;color:var(--accent);margin-top:6px}
.sw{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Stories ---------- */
.st{position:fixed;inset:0;z-index:30;background:#000;color:#fff;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  animation:stin .45s var(--out)}
@keyframes stin{from{transform:scale(.9);opacity:0;border-radius:40px}}
.st.out{animation:stout .35s var(--out) forwards}
@keyframes stout{to{transform:translateY(40%) scale(.85);opacity:0;border-radius:40px}}
.st-bg{position:absolute;inset:-40px;background:radial-gradient(circle at 30% 20%,var(--c) 0%,var(--c2) 55%,#05060c 100%);transition:background .6s}
.st-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(36px) saturate(150%) brightness(.65);transform:scale(1.2)}
.st-bg .blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;background:var(--c);filter:blur(80px);opacity:.5;top:30%;left:-30%;animation:drift 12s ease-in-out infinite alternate}

.st-x{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:1.3rem;line-height:1}
.st-stage{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px calc(env(safe-area-inset-bottom,0px) + 26px)}
.st-pic{position:absolute;left:22px;right:22px;top:calc(env(safe-area-inset-top,0px) + 86px);bottom:44%;border-radius:26px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:picin .7s var(--spring) both}
.st-pic img{width:100%;height:100%;object-fit:cover;animation:kb 9s ease-out both}
@keyframes picin{from{transform:translateY(30px) scale(.9) rotate(-3deg);opacity:0}}
.st-emo{position:absolute;left:0;right:0;top:20%;text-align:center;font-size:clamp(6rem,34vw,10rem);line-height:1;filter:drop-shadow(0 20px 30px rgba(0,0,0,.35));animation:emoin .9s var(--spring) both}
.st-emo span{display:inline-block;animation:bob 4s ease-in-out infinite .9s}
@keyframes emoin{from{transform:scale(.3) rotate(-25deg);opacity:0}}
.st-txt>*{animation:txt .6s var(--out) both}
.st-txt>*:nth-child(2){animation-delay:.08s}.st-txt>*:nth-child(3){animation-delay:.16s}.st-txt>*:nth-child(4){animation-delay:.24s}.st-txt>*:nth-child(5){animation-delay:.32s}
@keyframes txt{from{transform:translateY(22px);opacity:0}}
.st-k{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;opacity:.8;margin:0 0 6px}
.st-t{font-family:var(--serif);font-size:clamp(2.4rem,11vw,3.6rem);line-height:.98;letter-spacing:-.02em;margin:0 0 10px;text-shadow:0 2px 20px rgba(0,0,0,.3);overflow-wrap:anywhere}
.st-t.it{font-style:italic}
.st-m{font-size:.95rem;opacity:.85;margin:0 0 6px}
.st-n{font-size:1rem;margin:4px 0 0;opacity:.95}
.st-act{display:flex;gap:10px;margin-top:18px}
.st-act .btn{color:#fff;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28);box-shadow:none}
.st-act .btn.heart{flex:0 0 auto;width:auto;padding:15px 20px}
.st-act .btn.heart.on{background:#fff;color:#c2185b}
.st-act .btn.heart svg{transition:transform .4s var(--spring)}
.st-act .btn.heart.on svg{transform:scale(1.25)}
.st-hint{position:absolute;z-index:4;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 70px);text-align:center;font-size:.74rem;padding:8px 12px;border-radius:999px;
  background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:hint 4.5s ease forwards;pointer-events:none}
@keyframes hint{0%{opacity:0;transform:translateY(-8px)}10%,80%{opacity:1;transform:none}100%{opacity:0;visibility:hidden}}
.burst{position:fixed;z-index:60;pointer-events:none;width:0;height:0}
.burst i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;font-style:normal;font-size:16px;line-height:16px;animation:bst .9s var(--out) forwards}
@keyframes bst{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(var(--rt));opacity:0}}

/* Chegada de lista */
.arr{text-align:center;padding:30px 20px 24px;margin-top:20px}
.arr .big{position:relative;width:120px;height:120px;margin:10px auto 18px}
.arr .big .av{width:120px;height:120px;font-size:3rem;position:relative;z-index:1;animation:pop .8s var(--spring) backwards}
.arr .big i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--c);animation:wave 2.4s ease-out infinite}
.arr .big i:nth-child(2){animation-delay:.8s}.arr .big i:nth-child(3){animation-delay:1.6s}
@keyframes wave{from{transform:scale(1);opacity:.8}to{transform:scale(2.2);opacity:0}}

.toast{position:fixed;z-index:70;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);padding:12px 20px;border-radius:999px;
  background:var(--ink);color:var(--bg2);font-size:.92rem;font-weight:600;opacity:0;pointer-events:none;transition:all .4s var(--spring);max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;margin-top:26px;font-size:.82rem;color:var(--faint)}
.foot button{border:0;background:none;color:var(--mut);text-decoration:underline;text-underline-offset:3px;padding:6px}
.fadein{animation:fi .5s var(--out) both}
@keyframes fi{from{transform:translateY(12px);opacity:0}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

<script>
(function () {
'use strict';
/* ================= Dados ================= */
var COLORS = ['#ff6f61', '#ff4f8b', '#a36bff', '#3b8ff5', '#21c08b', '#e2a23a'];
var EMOS = ['🎁', '👗', '👟', '💍', '💄', '🧴', '📚', '🎧', '📱', '🎮', '🏠', '🪴', '🍷', '☕', '✈️', '🎟️', '🧸', '⌚', '👜', '✨'];
var LV = { 1: 'seria legal', 2: 'quero', 3: 'quero muito' };
var FICHA = [
  ['roupa', 'Camiseta / blusa', 0], ['calca', 'Calça / short', 0], ['pe', 'Calçado', 0], ['anel', 'Anel', 0],
  ['cores', 'Cores que ama', 1], ['marcas', 'Lojas e marcas', 1], ['cheiro', 'Perfumes e cheiros', 1],
  ['ama', 'Sempre agrada', 1], ['nao', 'Não me dê', 1]
];

function load(k, d) { try { var s = localStorage.getItem(k); return s ? JSON.parse(s) : d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function uid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

var me = load('wl_me', null);
var my = load('wl_my', { items: [], ficha: {}, rev: 0, sent: 0 });
var them = load('wl_them', null);
var res = load('wl_res', {});
var seen = load('wl_seen', {});
var S = { tab: 'me', list: 'natal', link: '' };

function persist() { save('wl_me', me); save('wl_my', my); save('wl_them', them); save('wl_res', res); save('wl_seen', seen); }
function touchMine() { my.rev++; save('wl_my', my); buildLink(); }

/* ================= Cores ================= */
function shade(hex, p) {
  var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255, t = p < 0 ? 0 : 255, f = Math.abs(p) / 100;
  r = Math.round((t - r) * f) + r; g = Math.round((t - g) * f) + g; b = Math.round((t - b) * f) + b;
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function cv(c) { return '--c:' + c + ';--c2:' + shade(c, -38); }
function av(p, extra) { return '<span class="av ' + (extra || '') + '" style="' + cv(p.color) + '">' + esc((p.name || '?').charAt(0).toUpperCase()) + '</span>'; }

/* ================= Preço, link, datas ================= */
function num(p) { if (!p) return 0; var s = String(p).replace(/[^\d,.]/g, ''); if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.'); else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); var n = parseFloat(s); return isNaN(n) ? 0 : n; }
function money(n) { return 'R$ ' + Math.round(n).toLocaleString('pt-BR'); }
function priceTxt(p) { var n = num(p); return n ? money(n) : ''; }
function host(u) { try { var a = document.createElement('a'); a.href = u; return a.hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
function guessTitle(u) {
  try {
    var a = document.createElement('a'); a.href = u; var best = '';
    a.pathname.split('/').forEach(function (s) { s = decodeURIComponent(s); if (s.split(/[-_]/).length > best.split(/[-_]/).length) best = s; });
    if (best.split(/[-_]/).length < 3) return '';
    best = best.replace(/\.(html?|aspx?|php)$/i, '').replace(/[-_]+/g, ' ').replace(/\s+\d{6,}.*$/, '').trim();
    var w = best.split(' ').slice(0, 7).join(' ');
    return w.charAt(0).toUpperCase() + w.slice(1);
  } catch (e) { return ''; }
}
function ago(t) {
  var d = Math.floor((Date.now() - t) / 86400000);
  return d <= 0 ? 'hoje' : d === 1 ? 'ontem' : 'há ' + d + ' dias';
}
function xmasDays() {
  var n = new Date(), y = n.getFullYear(), x = new Date(y, 11, 25);
  if (n > new Date(y, 11, 25, 23, 59)) x = new Date(y + 1, 11, 25);
  return Math.ceil((x - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 86400000);
}
function otherName() {
  if (them && them.name) return them.name;
  var n = load('jg_names', null);
  if (n && me) for (var i = 0; i < 2; i++) if (n[i] && n[i].toLowerCase() !== me.name.toLowerCase()) return n[i];
  return '';
}

/* ================= Link (sem servidor) ================= */
function b64u(b) { var s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var r = atob(s), b = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) b[i] = r.charCodeAt(i); return b; }
function pack() {
  return { v: 1, u: me.uid, n: me.name, c: me.color, t: Date.now(), f: my.ficha,
    i: my.items.map(function (x) { return [x.id, x.t, x.k === 'sempre' ? 1 : 0, x.lv, x.p || '', x.u || '', x.img || '', x.n || '', x.e || '', x.v ? 1 : 0, x.g ? 1 : 0]; }) };
}
function unpack(o) {
  return { uid: o.u, name: o.n, color: o.c, t: o.t, ficha: o.f || {},
    items: (o.i || []).map(function (a) { return { id: a[0], t: a[1], k: a[2] ? 'sempre' : 'natal', lv: a[3] || 1, p: a[4], u: a[5], img: a[6], n: a[7], e: a[8], v: !!a[9], g: !!a[10] }; }) };
}
function encode(obj) {
  var bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream) {
    try {
      return new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()
        .then(function (buf) { return 'z' + b64u(new Uint8Array(buf)); }, function () { return 'p' + b64u(bytes); });
    } catch (e) {}
  }
  return Promise.resolve('p' + b64u(bytes));
}
function decode(code) {
  var b = unb64u(code.slice(1));
  var p = code.charAt(0) === 'z'
    ? new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()
    : Promise.resolve(b.buffer);
  return p.then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
}
/* O link fica pronto antes do toque: o iPhone só abre o compartilhamento direto do gesto. */
function buildLink() {
  if (!me) return;
  encode(pack()).then(function (c) { S.link = location.origin + location.pathname + '#w=' + c; });
}
function share() {
  if (!S.link) { toast('Preparando o link, toque de novo'); buildLink(); return; }
  var done = function () { my.sent = my.rev; save('wl_my', my); renderDock(); toast('Lista enviada'); };
  var nm = otherName();
  if (navigator.share) {
    navigator.share({ title: 'Wishlist de ' + me.name, text: (nm ? nm + ', a' : 'A') + 'qui está minha wishlist 🎁', url: S.link }).then(done, function () {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(S.link).then(function () { done(); toast('Link copiado. Cole na conversa'); });
  } else { prompt('Copie o link:', S.link); done(); }
}
function importCode(code, fromPaste) {
  decode(code).then(function (o) {
    var p = unpack(o);
    if (me && p.uid === me.uid) { toast('Esse link é a sua própria lista'); render(); return; }
    var old = them && them.uid === p.uid ? them : null;
    var oldIds = old ? old.items.map(function (x) { return x.id; }) : [];
    p.fresh = old ? p.items.filter(function (x) { return oldIds.indexOf(x.id) < 0; }).map(function (x) { return x.id; }) : [];
    p.isNew = !old;
    if (them && !old) res = {};
    them = p; seen = {}; persist();
    S.tab = 'them'; S.arrival = true;
    render();
  }, function () { toast(fromPaste ? 'Esse link não abriu. Copie de novo.' : 'O link chegou incompleto'); render(); });
}

/* ================= UI util ================= */
var app = document.getElementById('app');
var tT;
function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.className = 'toast on'; clearTimeout(tT); tT = setTimeout(function () { t.className = 'toast'; }, 2400); }
var SVG = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7z"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>',
  link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'
};

/* Segmento com indicador que desliza até o botão ativo. */
function segHTML(name, opts, cur, cls) {
  return '<div class="seg glass gl ' + (cls || '') + '" data-seg="' + name + '"><span class="ind"></span>' + opts.map(function (o) {
    return '<button class="' + (o[0] === cur ? 'on' : '') + '" data-act="seg" data-k="' + name + '" data-v="' + o[0] + '">' + o[1] + '</button>';
  }).join('') + '</div>';
}
function placeInd(noAnim) {
  [].forEach.call(document.querySelectorAll('.seg'), function (sg) {
    var on = sg.querySelector('button.on'), ind = sg.querySelector('.ind');
    if (!on || !ind) return;
    if (noAnim) ind.style.transition = 'none';
    ind.style.width = on.offsetWidth + 'px';
    ind.style.transform = 'translateX(' + (on.offsetLeft - 4) + 'px)';
    if (noAnim) { ind.offsetWidth; ind.style.transition = ''; }
  });
}

/* ================= Telas ================= */
function render() {
  if (!me) return renderSetup();
  if (S.arrival && them) return renderArrival();
  var who = S.tab === 'me' ? me : them;
  var nm = otherName();
  var h = segHTML('tab', [['me', av(me) + 'Você'], ['them', them ? av(them) + esc(them.name) : '+ ' + (nm ? esc(nm) : 'Receber')]], S.tab);
  var title;
  if (S.tab === 'me') title = S.list === 'ficha' ? 'Sua <em>ficha</em>' : S.list === 'natal' ? 'Seu <em>Natal</em>' : 'Seus <em>desejos</em>';
  else if (!them) title = 'Lista de <em>' + (nm ? esc(nm) : 'quem você ama') + '</em>';
  else title = S.list === 'ficha' ? 'Ficha de <em>' + esc(them.name) + '</em>' : (S.list === 'natal' ? 'Natal de ' : 'Desejos de ') + '<em>' + esc(them.name) + '</em>';
  var k = S.list === 'natal' ? 'Natal ' + (new Date().getMonth() === 11 && new Date().getDate() > 25 ? new Date().getFullYear() + 1 : new Date().getFullYear()) + ' · faltam ' + xmasDays() + ' dias'
    : S.list === 'sempre' ? 'Para qualquer data' : 'Tamanhos e gostos';
  if (S.tab === 'them' && them) k = 'Atualizada ' + ago(them.t) + ' · ' + k.toLowerCase();
  h += '<p class="kick">' + k + '</p><h1>' + title + '</h1>';
  if (S.tab === 'them' && !them) { app.innerHTML = h + emptyThem(nm); after(); return; }
  h += segHTML('list', [['natal', 'Natal'], ['sempre', 'Sempre'], ['ficha', 'Ficha']], S.list, 'sub');
  if (S.list === 'ficha') h += S.tab === 'me' ? fichaEdit() : fichaView(them);
  else h += S.tab === 'me' ? mineList() : theirList();
  h += '<p class="foot">' + av(me) + ' ' + esc(me.name) + ' neste celular · <button data-act="profile">perfil</button></p>';
  app.innerHTML = h;
  after();
}
function after() { placeInd(true); renderDock(); bindTilt(); }

function itemsOf(p, kind) { return p.items.filter(function (x) { return x.k === kind; }); }

function tileHTML(x, p, i, mine) {
  var cls = 'tile lv' + x.lv + (x.v ? ' vague' : '');

  var n = ST.list.filter(function (x) { return res[x.id]; }).length;
  document.getElementById('stbg').innerHTML = '<span class="blob"></span>';
  document.getElementById('sts').innerHTML = '<div class="st-emo"><span>' + (n ? '💝' : '🎀') + '</span></div><div class="st-txt"><p class="st-k">Fim da lista</p>' +
    '<h2 class="st-t">' + (n ? 'Você vai dar ' + n + (n > 1 ? ' presentes' : ' presente') : 'Ainda nenhum escolhido') + '</h2>' +
    '<p class="st-m">' + (n ? esc(them.name) + ' não sabe de nada.' : 'Toque em Eu dou no que você quiser dar.') + '</p>' +
    '<div class="st-act"><button class="btn" data-st="again">Ver de novo</button><button class="btn" data-st="x" style="background:#fff;color:#111">Fechar</button></div></div>';
}
function nextStory() { if (ST.end) return; if (ST.i + 1 < ST.list.length) showStory(ST.i + 1); else endStory(); }
function prevStory() { if (ST.end) { showStory(ST.list.length - 1); return; } showStory(Math.max(0, ST.i - 1)); }
function closeStories() {
  if (!ST) return; var el = ST.el; cancelAnimationFrame(ST.raf); ST = null;
  el.classList.add('out'); setTimeout(function () { el.remove(); }, 340); render();
}
function bindStoryInput(el) {
  var sx, sy, st, hold, moved;
  el.addEventListener('pointerdown', function (e) {
    sx = e.clientX; sy = e.clientY; st = Date.now(); moved = 0;
    if (e.target.closest('[data-st]')) return;
    hold = setTimeout(function () { if (ST) ST.paused = true; }, 180);
  });
  el.addEventListener('pointermove', function (e) {
    if (sx == null) return; var dy = e.clientY - sy; moved = Math.max(moved, Math.abs(dy), Math.abs(e.clientX - sx));
    if (dy > 0 && Math.abs(dy) > Math.abs(e.clientX - sx)) { el.style.transform = 'translateY(' + dy * .6 + 'px) scale(' + (1 - dy / 2400) + ')'; el.style.borderRadius = Math.min(40, dy / 4) + 'px'; }
  });
  el.addEventListener('pointerup', function (e) {
    clearTimeout(hold); if (sx == null) return;
    var dy = e.clientY - sy, dt = Date.now() - st, b = e.target.closest('[data-st]'); sx = null;
    el.style.transform = ''; el.style.borderRadius = '';
    if (ST) ST.paused = false;
    if (dy > 120) { closeStories(); return; }
    if (b) {
      var a = b.getAttribute('data-st');
      if (a === 'x') closeStories();
      else if (a === 'again') showStory(0);
      else if (a === 'heart') { var x = ST.list[ST.i]; toggleRes(x.id, b); b.className = 'btn heart' + (res[x.id] ? ' on' : ''); b.innerHTML = SVG.heart + (res[x.id] ? 'Você dá' : 'Eu dou'); ST.t = 0; }
      return;
    }
    if (moved > 14 || dt > 400) return;
    if (e.clientX < window.innerWidth * 0.33) prevStory(); else nextStory();
  });
  el.addEventListener('pointercancel', function () { clearTimeout(hold); sx = null; if (ST) ST.paused = false; el.style.transform = ''; });
}

/* ================= Reservas ================= */
function burst(el, glyphs) {
  var r = el.getBoundingClientRect(), b = document.createElement('div');
  b.className = 'burst'; b.style.left = (r.left + r.width / 2) + 'px'; b.style.top = (r.top + r.height / 2) + 'px';
  var g = glyphs || ['💖', '✨', '💗', '⭐', '💕'];
  for (var i = 0; i < 16; i++) {
    var a = Math.PI * 2 * i / 16 + Math.random() * .4, d = 70 + Math.random() * 90, s = document.createElement('i');
    s.textContent = g[i % g.length];
    s.style.cssText = '--dx:' + Math.cos(a) * d + 'px;--dy:' + (Math.sin(a) * d - 40) + 'px;--rt:' + (Math.random() * 360 - 180) + 'deg;animation-delay:' + Math.random() * 80 + 'ms';
    b.appendChild(s);
  }
  document.body.appendChild(b); setTimeout(function () { b.remove(); }, 1100);
  if (navigator.vibrate) navigator.vibrate(18);
}
function toggleRes(id, el) {
  if (res[id]) delete res[id]; else { res[id] = 1; burst(el); }
  save('wl_res', res);
}

/* ================= Tema ================= */
function isDay() { var t = load('wl_theme', null); if (t) return t === 'day'; var h = new Date().getHours(); return h >= 6 && h < 18; }
function paintTheme(day) {
  document.body.className = day ? 'day' : 'night';
  document.getElementById('tc').setAttribute('content', day ? '#3aa6ee' : '#060914');
  document.getElementById('themeBtn').innerHTML = day ? SVG.moon : SVG.sun;
}
function toggleTheme(btn) {
  var day = document.body.className !== 'day';
  save('wl_theme', day ? 'day' : 'night');
  var r = btn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  var rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (document.startViewTransition && !reduce) {
    var tr = document.startViewTransition(function () { paintTheme(day); });
    tr.ready.then(function () {
      document.documentElement.animate({ clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + rad + 'px at ' + x + 'px ' + y + 'px)'] },
        { duration: 700, easing: 'cubic-bezier(.2,.8,.2,1)', pseudoElement: '::view-transition-new(root)' });
    });
  } else paintTheme(day);
}
function ambient() {
  var s = '', b = '';
  for (var i = 0; i < 40; i++) s += '<i style="left:' + Math.random() * 100 + '%;top:' + Math.random() * 70 + '%;animation-delay:' + Math.random() * 4 + 's;opacity:.3"></i>';
  for (var j = 0; j < 14; j++) { var z = 2 + Math.random() * 7; b += '<span class="bub" style="left:' + Math.random() * 100 + '%;width:' + z + 'vmax;height:' + z + 'vmax;--d:' + (14 + Math.random() * 16) + 's;--dl:-' + Math.random() * 30 + 's"></span>'; }
  document.getElementById('stars').innerHTML = s; document.getElementById('bubs').innerHTML = b;
}

/* Inclinação 3D e brilho que segue o dedo nos blocos */
function bindTilt() {
  [].forEach.call(document.querySelectorAll('.tile'), function (t) {
    t.addEventListener('pointermove', function (e) {
      var r = t.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      t.style.setProperty('--ry', ((px - .5) * 10) + 'deg'); t.style.setProperty('--rx', ((.5 - py) * 10) + 'deg');
      t.style.setProperty('--mx', px * 100 + '%'); t.style.setProperty('--my', py * 100 + '%');
    });
    t.addEventListener('pointerleave', function () { t.style.setProperty('--ry', '0deg'); t.style.setProperty('--rx', '0deg'); });
  });
}

/* ================= Ações ================= */
var A = {
  theme: function (el) { toggleTheme(el); },
  close: closeSheet,
  seg: function (el) {
    var k = el.getAttribute('data-k'), v = el.getAttribute('data-v');
    var sg = el.parentNode; [].forEach.call(sg.querySelectorAll('button'), function (b) { b.classList.toggle('on', b === el); }); placeInd();
    if (k === 'tab' || k === 'list') { setTimeout(function () { S[k] = v; render(); }, 140); }
    if (k === 'ftype') { F.v = v === 'vague'; document.getElementById('fItem').hidden = F.v; document.getElementById('fItem2').hidden = F.v; document.getElementById('ftl').textContent = F.v ? 'A dica' : 'O que é'; document.getElementById('ft').placeholder = F.v ? 'algo para a varanda' : 'Fone sem fio'; }
    if (k === 'fk') F.k = v;
  },
  lv: function (el) { F.lv = +el.getAttribute('data-v'); [].forEach.call(el.parentNode.children, function (b) { b.classList.toggle('on', b === el); }); },
  emo: function (el) { F.e = el.getAttribute('data-v'); [].forEach.call(el.parentNode.children, function (b) { b.classList.toggle('on', b === el); }); },
  add: function () { openForm(null); },
  fsave: saveForm,
  open: function (el) { openItem(el.getAttribute('data-id')); },
  edit: function (el) { openForm(el.getAttribute('data-id')); },
  got: function (el) { var x = findItem(el.getAttribute('data-id')).x; x.g = !x.g; touchMine(); closeSheet(); render(); if (x.g) { burst(el, ['🎉', '✨', '🎁']); toast('Que bom!'); } },
  del: function (el) {
    var id = el.getAttribute('data-id');
    if (el.getAttribute('data-sure')) { my.items = my.items.filter(function (x) { return x.id !== id; }); touchMine(); closeSheet(); render(); toast('Apagado'); return; }
    el.setAttribute('data-sure', '1'); el.textContent = 'Toque de novo para apagar'; el.style.color = 'var(--bad)';
  },
  res: function (el) { var id = el.getAttribute('data-id'); toggleRes(id, el); setTimeout(function () { openItem(id); render(); }, res[id] ? 450 : 0); },
  unres: function (el) { delete res[el.getAttribute('data-id')]; save('wl_res', res); openItem(el.getAttribute('data-id')); render(); },
  bought: function (el) { var id = el.getAttribute('data-id'); res[id] = res[id] === 2 ? 1 : 2; save('wl_res', res); if (res[id] === 2) burst(el, ['🛍️', '✨', '✓']); openItem(id); render(); },
  share: function () { if (!my.items.length && !Object.keys(my.ficha || {}).length) { toast('Adicione um desejo antes de enviar'); return; } share(); },
  stories: function (el) { S.arrival = false; S.tab = 'them'; S.list = el.getAttribute('data-v'); render(); openStories(S.list); },
  arrived: function () { S.arrival = false; S.list = itemsOf(them, 'natal').length || !itemsOf(them, 'sempre').length ? 'natal' : 'sempre'; render(); },
  paste: function () {
    var v = document.getElementById('paste').value.trim(), i = v.indexOf('#w='), e = document.getElementById('pasteErr');
    if (i < 0) { e.textContent = 'Esse não parece o link da wishlist. Ele tem #w= no final.'; e.hidden = false; return; }
    importCode(v.slice(i + 3), true);
  },
  pick: function (el) { document.getElementById('nm').value = el.getAttribute('data-v'); document.getElementById('nmErr').hidden = true; },
  color: function (el) { S.color = el.getAttribute('data-v'); [].forEach.call(el.parentNode.children, function (b) { b.classList.toggle('on', b === el); }); },
  start: function () {
    var n = document.getElementById('nm').value.trim();
    if (!n) { var e = document.getElementById('nmErr'); e.textContent = 'Escreva seu nome.'; e.hidden = false; return; }
    var first = !me;
    me = { uid: (me && me.uid) || uid(), name: n, color: S.color || COLORS[1] };
    save('wl_me', me); if (!first) touchMine(); else buildLink();
    S.editing = false; render();
  },
  profile: function () {
    openSheet('<h2>Perfil</h2><p class="mut">Você é <b>' + esc(me.name) + '</b> neste celular.</p><div class="stack" style="margin-top:14px">' +
      '<button class="btn gl" data-act="reprofile">Trocar nome ou cor</button>' +
      (them ? '<button class="btn gl" data-act="forget">Esquecer a lista de ' + esc(them.name) + '</button>' : '') +
      '<button class="btn ghost" data-act="wipe">Apagar tudo deste celular</button></div>');
  },
  reprofile: function () { closeSheet(); renderSetup(); },
  forget: function (el) {
    if (!el.getAttribute('data-sure')) { el.setAttribute('data-sure', 1); el.textContent = 'Toque de novo para esquecer'; return; }
    them = null; res = {}; seen = {}; persist(); closeSheet(); S.tab = 'me'; render();
  },
  wipe: function (el) {
    if (!el.getAttribute('data-sure')) { el.setAttribute('data-sure', 1); el.textContent = 'Toque de novo: apaga sua lista também'; el.style.color = 'var(--bad)'; return; }
    ['wl_me', 'wl_my', 'wl_them', 'wl_res', 'wl_seen'].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
    location.reload();
  }
};
document.addEventListener('click', function (e) {
  if (ST && e.target.closest('.st')) { if (!e.target.closest('a')) e.preventDefault(); return; }
  var el = e.target.closest('[data-act]');
  if (el && A[el.getAttribute('data-act')]) { e.preventDefault(); A[el.getAttribute('data-act')](el, e); }
});
document.addEventListener('input', function (e) {
  var k = e.target.getAttribute && e.target.getAttribute('data-f');
  if (!k) return;
  var v = e.target.value.trim(); if (v) my.ficha[k] = v; else delete my.ficha[k];
  clearTimeout(A._ft); A._ft = setTimeout(function () { touchMine(); renderDock(); }, 400);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if (ST) closeStories(); else closeSheet(); }
  if (ST && e.key === 'ArrowRight') nextStory();
  if (ST && e.key === 'ArrowLeft') prevStory();
  if (e.key === 'Enter' && e.target.id === 'nm') A.start();
});
window.addEventListener('resize', function () { placeInd(true); });

/* ================= Início ================= */
paintTheme(isDay());
ambient();
buildLink();
var hm = location.hash.match(/^#w=([A-Za-z0-9_-]+)/);
if (hm) { history.replaceState(null, '', location.pathname); importCode(hm[1]); }
else render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { placeInd(true); });
})();
</script>
