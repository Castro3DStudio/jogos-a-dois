:root{--acc:#56c2b2;--acc-ink:#04201c;--glow:rgba(86,194,178,.18)}
.scene{border-radius:1rem;overflow:hidden;border:1px solid var(--line);background:#000;margin:.6rem 0}
.scene svg{display:block;width:100%;height:auto;-webkit-filter:blur(16px);filter:blur(16px);-webkit-transform:scale(2.6);transform:scale(2.6);
  -webkit-transition:-webkit-filter 18s linear,-webkit-transform 18s ease-out;transition:filter 18s linear,transform 18s ease-out}
.scene.go svg,.scene.full svg{-webkit-filter:none;filter:none;-webkit-transform:none;transform:none}
.scene.full svg{-webkit-transition:none;transition:none}
.emo{font-size:3.6rem;line-height:1.2;margin:1.2rem 0;letter-spacing:.2rem}
.val{display:inline-block;border:1px solid var(--acc);color:var(--acc);border-radius:2rem;padding:.15rem .8rem;font-size:.85rem}
#extra{min-height:.5rem}
#extra .emo{font-size:2.2rem;margin:.4rem 0}
#extra .q{font-size:1.1rem;margin:.4rem 0}
</style>

['Round 6','s','🦑🍪🔺','Endividados voltam a brincar como crianças por um prêmio em dinheiro.','Batatinha frita, um, dois, três.','round6'],
['The Office','s','📎🏢📄','Documentário sobre uma empresa de papel dura mais que o interesse por papel.','Foi o que ela disse.','office'],
['La Casa de Papel','s','🎭💶🏦','Professor dá aula para alunos com nomes de cidades.','',''],
['Dark','s','🕳️⏳☔','Numa cidade pequena, todo mundo é parente de todo mundo, em vários anos.','',''],
['Peaky Blinders','s','🧢🥃🐎','Família de Birmingham resolve os negócios de boina.','',''],
['Grey\'s Anatomy','s','🩺💔🚁','Médicos operam pouco e sofrem muito num hospital de Seattle.','',''],
['Wandinha','s','🖐️🎻🖤','Adolescente de tranças muda de escola e leva uma mão de estimação.','',''],
['The Last of Us','s','🍄🔦🦒','Contrabandista atravessa o país com uma menina que conta piadas ruins.','',''],
['Black Mirror','s','📱🪞🐷','Cada episódio dá um motivo novo para desligar o celular.','',''],
['How I Met Your Mother','s','☂️🍺🎺','Pai leva nove temporadas para responder a uma pergunta simples.','',''],
['Bridgerton','s','🐝💃✉️','Uma autora anônima publica a fofoca da temporada.','',''],
['Chaves','s','🛢️🥪🏘️','Menino mora num barril e sonha com sanduíche de presunto.','Foi sem querer querendo.','']
];
var KIND = { f: 'Filme', a: 'Animação', s: 'Série' };
var MODE = { cena: 'Cena', fala: 'Fala', emoji: 'Emoji', sinopse: 'Sinopse torta' };
var S, N, tick = null, ox = 50, oy = 50;

function stop() { if (tick) { clearInterval(tick); tick = null; } }
function pts() { document.getElementById('pts').innerHTML = S && S.sc ? '<b>' + S.sc[0] + '</b> · <b>' + S.sc[1] + '</b>' : ''; }
function types(t) { var a = ['emoji', 'sinopse']; if (t[4]) a.push('fala'); if (t[5]) a.push('cena'); return a; }
function clue(t, type, cls) {
  if (type === 'cena') return '<div class="scene ' + (cls || '') + '" id="sc"><svg viewBox="0 0 320 180" style="-webkit-transform-origin:' + ox + '% ' + oy + '%;transform-origin:' + ox + '% ' + oy + '%">' + SV[t[5]] + '</svg></div>';
  if (type === 'fala') return '<p class="q">“' + JG.esc(t[4]) + '”</p>';
  if (type === 'emoji') return '<div class="emo">' + t[2] + '</div>';
  return '<p class="q">' + JG.esc(t[3]) + '</p>';
}
function tog(obj, k) { obj[k] = !obj[k]; var any = false; for (var x in obj) if (obj[x]) any = true; if (!any) obj[k] = true; }

function menu() {
  stop(); S = { kinds: { f: true, a: true, s: true }, modes: { cena: true, fala: true, emoji: true, sinopse: true }, total: 12 }; pts();
  (function draw() {
    var row = function (map, sel, act) {
      var h = ''; for (var k in map) h += '<button class="btn sm' + (sel[k] ? ' on' : '') + '" data-act="' + act + '" data-v="' + k + '">' + map[k] + '</button>';
      return '<div class="wrap">' + h + '</div>';
    };
    JG.view('<h1>Fotograma</h1><p class="mut">A pista aparece e vai perdendo valor. Quem souber aperta o próprio nome e responde em voz alta. Errar custa um ponto.</p>' +
      '<p class="kick">Entra no jogo</p>' + row(KIND, S.kinds, 'k') + '<p class="kick">Tipos de pista</p>' + row(MODE, S.modes, 'm') +
      '<p class="kick">Rodadas</p><div class="row">' + [8, 12, 20].map(function (n) {
        return '<button class="btn sm' + (S.total === n ? ' on' : '') + '" data-act="t" data-v="' + n + '">' + n + '</button>';
      }).join('') + '</div><button class="btn primary" data-act="go">Luz, câmera</button>', {
      k: function (el) { tog(S.kinds, el.getAttribute('data-v')); draw(); },
      m: function (el) { tog(S.modes, el.getAttribute('data-v')); draw(); },
      t: function (el) { S.total = +el.getAttribute('data-v'); draw(); },
      go: begin
    });
  })();
}
function begin() {
  var seen = JG.store('jg_foto_seen') || [], list = T.filter(function (t) { return S.kinds[t[1]]; });
  var fresh = list.filter(function (t) { return seen.indexOf(t[0]) < 0; });
  if (fresh.length < S.total) { seen = []; fresh = list; }
  S.r = [];
  JG.shuffle(fresh).forEach(function (t) {
    if (S.r.length >= S.total) return;
    var ok = types(t).filter(function (x) { return S.modes[x]; });
    if (!ok.length) return;
    /* A cena pesa mais no sorteio: é a pista mais gostosa de adivinhar. */
    var bag = ok.concat(ok.indexOf('cena') >= 0 ? ['cena', 'cena', 'cena'] : []);
    S.r.push({ t: t, type: JG.pick(bag) });
  });
  JG.store('jg_foto_seen', seen.concat(S.r.map(function (r) { return r.t[0]; })));
  S.i = 0; S.sc = [0, 0]; pts(); round();
}
function head(r) { return '<p class="kick">' + (S.i + 1) + ' de ' + S.r.length + ' · ' + KIND[r.t[1]] + ' · ' + MODE[r.type] + '</p>'; }
function round() {
  stop();
  if (S.i >= S.r.length) return end();
  var r = S.r[S.i]; r.pts = 5; ox = 20 + Math.floor(Math.random() * 60); oy = 25 + Math.floor(Math.random() * 50);
  JG.view(head(r) + clue(r.t, r.type) + '<div id="extra"></div><p><span class="val">Vale <b id="val">5</b></span></p>' +
    '<div class="row"><button class="btn primary" data-act="b" data-v="0">' + JG.esc(N[0]) + ' sabe</button><button class="btn primary" data-act="b" data-v="1">' + JG.esc(N[1]) + ' sabe</button></div>' +
    '<div class="row"><button class="btn ghost sm" data-act="dica">Dica extra</button><button class="btn ghost sm" data-act="nin">Ninguém sabe</button></div>', {
    b: function (el) { buzz(r, +el.getAttribute('data-v')); },
    dica: function (el) {
      var other = types(r.t).filter(function (x) { return x !== r.type && x !== 'cena'; })[0];
      document.getElementById('extra').innerHTML = clue(r.t, other);
      r.pts = Math.min(r.pts, 2); document.getElementById('val').textContent = r.pts; el.disabled = true;
    },
    nin: function () { answer(r, -1); }
  });
  setTimeout(function () { var sc = document.getElementById('sc'); if (sc) sc.className = 'scene go'; }, 80);
  tick = setInterval(function () {
    var v = document.getElementById('val'); if (!v) return stop();
    if (r.pts > 1) { r.pts--; v.textContent = r.pts; }
  }, 4500);
}
function buzz(r, who) {
  stop();
  JG.view(head(r) + clue(r.t, r.type, 'full') + '<h2><span class="acc">' + JG.esc(N[who]) + '</span> responde em voz alta</h2>' +
    '<button class="btn primary" data-act="v">Ver a resposta</button>', { v: function () { answer(r, who); } });
}
function answer(r, who) {
  stop();
  var h = head(r) + (r.type === 'cena' ? clue(r.t, 'cena', 'full') : '') + '<h1>' + JG.esc(r.t[0]) + '</h1><p class="mut">' + JG.esc(r.t[3]) + '</p>';
  var go = function (d) { if (who >= 0) S.sc[who] += d; S.i++; pts(); round(); };
  if (who < 0) return JG.view(h + '<button class="btn primary" data-act="n">Próxima</button>', { n: function () { go(0); } });
  JG.view(h + '<div class="row"><button class="btn primary" data-act="y">Acertou, +' + r.pts + '</button><button class="btn" data-act="x">Errou, −1</button></div>', {
    y: function () { go(r.pts); }, x: function () { go(-1); }
  });
}
function end() {
  var w = S.sc[0] === S.sc[1] ? -1 : S.sc[0] > S.sc[1] ? 0 : 1;
  JG.view('<p class="kick">Créditos finais</p><h2>' + (w < 0 ? 'Empate técnico.' : JG.esc(N[w]) + ' leva a estatueta.') + '</h2>' +
    '<div class="vs"><div><div class="who">' + JG.esc(N[0]) + '</div><div class="big">' + S.sc[0] + '</div></div><div><div class="who">' + JG.esc(N[1]) +
    '</div><div class="big">' + S.sc[1] + '</div></div></div><p class="mut">' + (w < 0 ? 'O filme de hoje se decide no par ou ímpar.' : 'Quem perdeu escolhe o filme de hoje. Prêmio de consolação.') +
    '</p><button class="btn primary" data-act="a">Outra sessão</button><a class="btn ghost" href="../">Outros jogos</a>', { a: menu });
}

JG.needNames(function (n) { N = n; menu(); });
})();
</script>
</body>
</html>
